<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sự kiện 2026</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel 7 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        body { background-color: #f3f4f6; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Cấu hình màu sắc ---
        const phaseStyles = {
            'Giai đoạn 1': 'bg-blue-100 text-blue-700 border-blue-200',
            'Giai đoạn 2': 'bg-emerald-100 text-emerald-700 border-emerald-200',
            'Giai đoạn 3': 'bg-amber-100 text-amber-700 border-amber-200',
            'Hoàn thiện chương trình': 'bg-orange-100 text-orange-700 border-orange-200',
            'Giai đoạn 4': 'bg-pink-100 text-pink-700 border-pink-200',
            'Giai đoạn 5': 'bg-rose-100 text-rose-700 border-rose-200',
            'Ngày sự kiện': 'bg-red-600 text-white border-red-700 font-bold shadow-sm',
            'Hậu sự kiện': 'bg-slate-200 text-slate-700 border-slate-300'
        };

        const getPhaseStyle = (phase) => phaseStyles[phase] || 'bg-gray-100 text-gray-700 border-gray-200';

        // --- Icons ---
        const iconsData = {
            Plus: <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />,
            Trash2: <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
            Edit2: <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
            Calendar: <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
            Users: <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
            AlertCircle: <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
            CheckCircle: <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />,
            Clock: <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
            FileSpreadsheet: <path strokeLinecap="round" strokeLinejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,
            Loader2: <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
            LinkIcon: <path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />,
            LayoutDashboard: <path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
            CalendarDays: <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
            FileText: <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,
            ExternalLink: <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
            FileAudio: <path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />,
            NoteIcon: <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        };

        const SvgIcon = ({ name, className }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                {iconsData[name]}
            </svg>
        );

        const Plus = (props) => <SvgIcon name="Plus" {...props} />;
        const Trash2 = (props) => <SvgIcon name="Trash2" {...props} />;
        const Edit2 = (props) => <SvgIcon name="Edit2" {...props} />;
        const Calendar = (props) => <SvgIcon name="Calendar" {...props} />;
        const Users = (props) => <SvgIcon name="Users" {...props} />;
        const AlertCircle = (props) => <SvgIcon name="AlertCircle" {...props} />;
        const CheckCircle = (props) => <SvgIcon name="CheckCircle" {...props} />;
        const Clock = (props) => <SvgIcon name="Clock" {...props} />;
        const FileSpreadsheet = (props) => <SvgIcon name="FileSpreadsheet" {...props} />;
        const Loader2 = (props) => <SvgIcon name="Loader2" {...props} />;
        const LinkIcon = (props) => <SvgIcon name="LinkIcon" {...props} />;
        const LayoutDashboard = (props) => <SvgIcon name="LayoutDashboard" {...props} />;
        const CalendarDays = (props) => <SvgIcon name="CalendarDays" {...props} />;
        const FileText = (props) => <SvgIcon name="FileText" {...props} />;
        const ExternalLink = (props) => <SvgIcon name="ExternalLink" {...props} />;
        const FileAudio = (props) => <SvgIcon name="FileAudio" {...props} />;
        const NoteIcon = (props) => <SvgIcon name="NoteIcon" {...props} />;

        function App() {
            const [activeTab, setActiveTab] = useState('Tasks'); 
            const [appData, setAppData] = useState({ Tasks: [], Meetings: [], Documents: [] });
            const [loading, setLoading] = useState(false);
            const [syncing, setSyncing] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            
            const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbx1mfEp5N2Xe-Bfj4zM4YZ0zvPy_nhzHa8K8aGe049LiNFvSX3-jSBiZFIFn5H4luI-vw/exec';
            const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gas_script_url') || DEFAULT_URL);
            const [showUrlInput, setShowUrlInput] = useState(false);

            // Updated Form States
            const [taskForm, setTaskForm] = useState({ title: '', phase: 'Giai đoạn 1', deadline: '', assignee: '', status: 'todo', notes: '', attachment: '' });
            const [meetingForm, setMeetingForm] = useState({ time: '', content: '', attendees: '', docLink: '' });
            const [docForm, setDocForm] = useState({ name: '', link: '' });

            const callGAS = async (action, payload = {}) => {
                if (!scriptUrl) return null;
                setSyncing(true);
                try {
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, ...payload })
                    });
                    const result = await response.json();
                    if (!result || !result.success) throw new Error((result && result.error) || 'Lỗi không xác định');
                    return result;
                } catch (error) {
                    console.error("Lỗi đồng bộ:", error);
                    alert("Lỗi đồng bộ dữ liệu: " + error.message);
                    return null;
                } finally {
                    setSyncing(false);
                }
            };

            const fetchAllData = async () => {
                if (!scriptUrl) return;
                setLoading(true);
                try {
                    const [tasksRes, meetingsRes, docsRes] = await Promise.all([
                        callGAS('GET_DATA', { sheetName: 'Tasks' }),
                        callGAS('GET_DATA', { sheetName: 'Meetings' }),
                        callGAS('GET_DATA', { sheetName: 'Documents' })
                    ]);
                    
                    setAppData({
                        Tasks: (tasksRes && tasksRes.data) || [],
                        Meetings: (meetingsRes && meetingsRes.data) || [],
                        Documents: (docsRes && docsRes.data) || []
                    });
                } catch (error) {
                    console.error("Lỗi tải dữ liệu", error);
                }
                setLoading(false);
            };

            useEffect(() => {
                if (scriptUrl && !showUrlInput) fetchAllData();
            }, [scriptUrl, showUrlInput]);

            const handleSaveUrl = () => {
                if (scriptUrl) {
                    localStorage.setItem('gas_script_url', scriptUrl);
                    setShowUrlInput(false);
                }
            };

            const handleDragStart = (e, taskId) => e.dataTransfer.setData('taskId', taskId);

            const handleDrop = async (e, newStatus) => {
                e.preventDefault();
                const taskId = e.dataTransfer.getData('taskId');
                if (!taskId) return;

                setAppData(prev => ({
                    ...prev,
                    Tasks: prev.Tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t)
                }));
                
                const taskToUpdate = appData.Tasks.find(t => t.id === taskId);
                if (taskToUpdate) {
                    await callGAS('UPDATE_DATA', { sheetName: 'Tasks', item: { ...taskToUpdate, status: newStatus } });
                }
            };

            const handleSaveItem = async (e) => {
                e.preventDefault();
                const currentForm = activeTab === 'Tasks' ? taskForm : activeTab === 'Meetings' ? meetingForm : docForm;
                const sheetName = activeTab;

                if (editingItem) {
                    const updatedItem = { ...editingItem, ...currentForm };
                    setAppData(prev => ({
                        ...prev,
                        [sheetName]: prev[sheetName].map(item => item.id === updatedItem.id ? updatedItem : item)
                    }));
                    await callGAS('UPDATE_DATA', { sheetName, item: updatedItem });
                } else {
                    const tempId = 'temp-' + Date.now();
                    const newItem = { ...currentForm, id: tempId };
                    setAppData(prev => ({
                        ...prev,
                        [sheetName]: [...prev[sheetName], newItem]
                    }));
                    const result = await callGAS('ADD_DATA', { sheetName, item: currentForm });
                    if (result && result.data) {
                        setAppData(prev => ({
                            ...prev,
                            [sheetName]: prev[sheetName].map(item => item.id === tempId ? result.data : item)
                        }));
                    }
                }
                closeModal();
            };

            const handleDeleteItem = async (itemId) => {
                if (window.confirm('Bạn có chắc chắn muốn xóa mục này khỏi Google Sheets?')) {
                    const sheetName = activeTab;
                    setAppData(prev => ({
                        ...prev,
                        [sheetName]: prev[sheetName].filter(item => item.id !== itemId)
                    }));
                    await callGAS('DELETE_DATA', { sheetName, itemId });
                }
            };

            const openModal = (item = null) => {
                setEditingItem(item);
                if (activeTab === 'Tasks') {
                    setTaskForm(item ? { ...item } : { title: '', phase: 'Giai đoạn 1', deadline: '', assignee: '', status: 'todo', notes: '', attachment: '' });
                } else if (activeTab === 'Meetings') {
                    setMeetingForm(item ? { ...item } : { time: '', content: '', attendees: '', docLink: '' });
                } else if (activeTab === 'Documents') {
                    setDocForm(item ? { ...item } : { name: '', link: '' });
                }
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingItem(null);
            };

            const renderTasksBoard = () => {
                const columns = [
                    { id: 'todo', title: 'Cần làm', icon: <AlertCircle className="w-5 h-5 text-gray-500" />, color: 'bg-gray-100' },
                    { id: 'in_progress', title: 'Đang thực hiện', icon: <Clock className="w-5 h-5 text-blue-500" />, color: 'bg-blue-50' },
                    { id: 'done', title: 'Hoàn thành', icon: <CheckCircle className="w-5 h-5 text-green-500" />, color: 'bg-green-50' }
                ];

                return (
                    <div className="flex flex-col lg:flex-row gap-6 items-start animate-fade-in">
                        {columns.map(col => (
                            <div key={col.id} className={`flex-1 w-full rounded-xl p-4 min-h-[500px] border border-gray-200 ${col.color}`} onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDrop(e, col.id)}>
                                <div className="flex items-center justify-between mb-4 pb-2 border-b border-gray-300">
                                    <div className="flex items-center gap-2">
                                        {col.icon}
                                        <h2 className="font-semibold text-lg text-gray-800 uppercase tracking-tighter">{col.title}</h2>
                                    </div>
                                    <span className="bg-white text-gray-600 text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">
                                        {appData.Tasks.filter(t => t.status === col.id).length}
                                    </span>
                                </div>
                                <div className="space-y-3">
                                    {appData.Tasks.filter(t => t.status === col.id).map(task => (
                                        <div key={task.id} draggable onDragStart={(e) => handleDragStart(e, task.id)} className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 cursor-grab hover:shadow-md transition-all group">
                                            <div className="flex justify-between items-start mb-2">
                                                <span className={`text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded border ${getPhaseStyle(task.phase)}`}>
                                                    {task.phase}
                                                </span>
                                                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={() => openModal(task)} className="p-1 text-gray-400 hover:text-blue-600"><Edit2 className="w-4 h-4" /></button>
                                                    <button onClick={() => handleDeleteItem(task.id)} className="p-1 text-gray-400 hover:text-red-600"><Trash2 className="w-4 h-4" /></button>
                                                </div>
                                            </div>
                                            <h3 className="font-semibold text-gray-800 mb-2 leading-tight">{task.title}</h3>
                                            
                                            {/* Preview Ghi chú & Tài liệu */}
                                            {(task.notes || task.attachment) && (
                                                <div className="flex gap-2 mb-3">
                                                    {task.notes && (
                                                        <div title={task.notes} className="flex items-center text-[10px] bg-gray-50 text-gray-500 px-1.5 py-0.5 rounded border border-gray-100">
                                                            <NoteIcon className="w-3 h-3 mr-1" /> Có ghi chú
                                                        </div>
                                                    )}
                                                    {task.attachment && (
                                                        <a href={task.attachment} target="_blank" rel="noreferrer" className="flex items-center text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded border border-blue-100 hover:bg-blue-100">
                                                            <ExternalLink className="w-3 h-3 mr-1" /> Tài liệu
                                                        </a>
                                                    )}
                                                </div>
                                            )}

                                            <div className="flex flex-col gap-1.5 text-[11px] text-gray-500">
                                                <div className="flex items-center gap-2"><Users className="w-3 h-3" /><span className="truncate font-medium">{task.assignee || 'Chưa phân công'}</span></div>
                                                <div className="flex items-center gap-2 font-bold text-gray-700 italic"><Calendar className="w-3 h-3" /><span>{task.deadline ? new Date(task.deadline).toLocaleDateString('vi-VN') : 'N/A'}</span></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                );
            };

            const renderMeetings = () => (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden animate-fade-in">
                    <div className="overflow-x-auto scrollbar-hide">
                        <table className="w-full text-left text-sm text-gray-600">
                            <thead className="bg-gray-50 text-gray-700 uppercase font-bold text-xs border-b border-gray-200">
                                <tr><th className="px-6 py-4">Thời gian</th><th className="px-6 py-4">Nội dung họp</th><th className="px-6 py-4">Thành phần</th><th className="px-6 py-4 text-center">Tài liệu</th><th className="px-6 py-4 text-right">Thao tác</th></tr>
                            </thead>
                            <tbody>
                                {appData.Meetings.length === 0 ? (
                                    <tr><td colSpan="5" className="text-center py-10 text-gray-400 italic">Chưa có lịch họp nào.</td></tr>
                                ) : appData.Meetings.map((meeting) => (
                                    <tr key={meeting.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                        <td className="px-6 py-4 font-bold text-blue-700 whitespace-nowrap">{meeting.time ? new Date(meeting.time).toLocaleString('vi-VN', {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric'}) : ''}</td>
                                        <td className="px-6 py-4 font-medium text-gray-800">{meeting.content}</td>
                                        <td className="px-6 py-4"><div className="flex items-center gap-2"><Users className="w-4 h-4 text-gray-400"/> {meeting.attendees}</div></td>
                                        <td className="px-6 py-4 text-center">
                                            {meeting.docLink ? (<a href={meeting.docLink} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-semibold hover:bg-indigo-100 transition-colors"><LinkIcon className="w-3 h-3"/> Xem</a>) : <span className="text-gray-400 text-xs italic">-</span>}
                                        </td>
                                        <td className="px-6 py-4 text-right">
                                            <div className="flex justify-end gap-2">
                                                <button onClick={() => openModal(meeting)} className="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded"><Edit2 className="w-4 h-4" /></button>
                                                <button onClick={() => handleDeleteItem(meeting.id)} className="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded"><Trash2 className="w-4 h-4" /></button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const renderDocuments = () => (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
                    {appData.Documents.length === 0 ? (
                        <div className="col-span-full text-center py-16 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400 italic">Kho tài liệu hiện đang trống.</div>
                    ) : appData.Documents.map((doc) => (
                        <div key={doc.id} className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all group flex flex-col h-full border-t-4 border-t-blue-500">
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 bg-blue-50 rounded-lg text-blue-600"><FileText className="w-6 h-6" /></div>
                                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onClick={() => openModal(doc)} className="p-1.5 text-gray-400 hover:text-blue-600 rounded"><Edit2 className="w-4 h-4" /></button>
                                    <button onClick={() => handleDeleteItem(doc.id)} className="p-1.5 text-gray-400 hover:text-red-600 rounded"><Trash2 className="w-4 h-4" /></button>
                                </div>
                            </div>
                            <h3 className="font-bold text-gray-800 text-lg mb-4 flex-1">{doc.name}</h3>
                            <a href={doc.link} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 w-full py-2.5 bg-gray-50 hover:bg-blue-600 hover:text-white text-gray-700 rounded-lg text-sm font-bold transition-all border border-gray-200 tracking-widest uppercase">Mở Tài liệu</a>
                        </div>
                    ))}
                </div>
            );

            if (showUrlInput) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-t-4 border-blue-600 animate-fade-in">
                            <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2"><FileSpreadsheet className="text-blue-600 w-6 h-6" /> Kết nối Google Sheets</h2>
                            <p className="text-gray-600 mb-6 text-sm italic">Nhập Web App URL từ Apps Script để đồng bộ hóa dữ liệu trực tiếp.</p>
                            <input type="text" value={scriptUrl} onChange={(e) => setScriptUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-sm"/>
                            <button onClick={handleSaveUrl} disabled={!scriptUrl} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg disabled:opacity-50 transition-colors shadow-lg">KẾT NỐI HỆ THỐNG</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 font-sans p-4 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-xl shadow-sm p-6 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border border-gray-200 border-l-4 border-l-blue-600">
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className="text-2xl md:text-3xl font-bold text-gray-800 tracking-tight uppercase">Quản lý Sự kiện 2026</h1>
                                    {syncing && <span className="flex items-center text-[9px] font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded-full uppercase"><Loader2 className="w-3 h-3 animate-spin mr-1" /> Đang lưu...</span>}
                                </div>
                                <p className="text-gray-500 mt-1 text-xs font-medium italic">Hội nghị Quốc tế & Ngày Nghiên cứu - Đổi mới sáng tạo</p>
                            </div>
                            
                            <div className="flex gap-3">
                                <button onClick={() => setShowUrlInput(true)} className="flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-xs font-bold transition-all border border-gray-200">
                                    <LinkIcon className="w-4 h-4" /> ĐỔI CSDL
                                </button>
                                <button onClick={() => openModal()} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-xs font-bold shadow-lg transition-all hover:scale-105 active:scale-95 uppercase tracking-wider">
                                    <Plus className="w-4 h-4" /> THÊM MỚI
                                </button>
                            </div>
                        </div>

                        <div className="flex space-x-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
                            <button onClick={() => setActiveTab('Tasks')} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold text-xs transition-all whitespace-nowrap uppercase tracking-tighter ${activeTab === 'Tasks' ? 'bg-blue-600 text-white shadow-lg scale-105' : 'bg-white text-gray-500 hover:bg-gray-50 border border-gray-200'}`}><LayoutDashboard className="w-5 h-5" /> KANBAN CÔNG VIỆC</button>
                            <button onClick={() => setActiveTab('Meetings')} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold text-xs transition-all whitespace-nowrap uppercase tracking-tighter ${activeTab === 'Meetings' ? 'bg-blue-600 text-white shadow-lg scale-105' : 'bg-white text-gray-500 hover:bg-gray-50 border border-gray-200'}`}><CalendarDays className="w-5 h-5" /> LỊCH HỌP ({appData.Meetings.length})</button>
                            <button onClick={() => setActiveTab('Documents')} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold text-xs transition-all whitespace-nowrap uppercase tracking-tighter ${activeTab === 'Documents' ? 'bg-blue-600 text-white shadow-lg scale-105' : 'bg-white text-gray-500 hover:bg-gray-50 border border-gray-200'}`}><FileAudio className="w-5 h-5" /> KHO TÀI LIỆU ({appData.Documents.length})</button>
                        </div>

                        {activeTab === 'Tasks' && renderTasksBoard()}
                        {activeTab === 'Meetings' && renderMeetings()}
                        {activeTab === 'Documents' && renderDocuments()}
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 border-t-8 border-blue-600 my-8">
                                <h2 className="text-2xl font-black text-gray-800 mb-6 uppercase tracking-tight">{editingItem ? 'Cập nhật' : 'Thêm mới'}</h2>
                                <form onSubmit={handleSaveItem} className="space-y-4">
                                    {activeTab === 'Tasks' && (
                                        <>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Tên công việc</label><input type="text" required value={taskForm.title} onChange={e => setTaskForm({...taskForm, title: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:bg-white outline-none transition-all font-medium" /></div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Giai đoạn</label>
                                                    <select value={taskForm.phase} onChange={e => setTaskForm({...taskForm, phase: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:bg-white outline-none transition-all font-bold">
                                                        <option value="Giai đoạn 1">Giai đoạn 1</option><option value="Giai đoạn 2">Giai đoạn 2</option><option value="Giai đoạn 3">Giai đoạn 3</option><option value="Hoàn thiện chương trình">Hoàn thiện chương trình</option><option value="Giai đoạn 4">Giai đoạn 4</option><option value="Giai đoạn 5">Giai đoạn 5</option><option value="Ngày sự kiện">Ngày sự kiện</option><option value="Hậu sự kiện">Hậu sự kiện</option>
                                                    </select>
                                                </div>
                                                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Phụ trách</label><input type="text" value={taskForm.assignee} onChange={e => setTaskForm({...taskForm, assignee: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:bg-white outline-none transition-all" /></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Hạn chót</label><input type="date" value={taskForm.deadline} onChange={e => setTaskForm({...taskForm, deadline: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:bg-white outline-none transition-all" /></div>
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Trạng thái</label>
                                                    <select value={taskForm.status} onChange={e => setTaskForm({...taskForm, status: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 focus:bg-white outline-none transition-all">
                                                        <option value="todo">Cần làm</option><option value="in_progress">Đang làm</option><option value="done">Xong</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Link tài liệu đính kèm</label><input type="url" value={taskForm.attachment} onChange={e => setTaskForm({...taskForm, attachment: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all font-medium" placeholder="https://..." /></div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Ghi chú chi tiết</label><textarea rows="3" value={taskForm.notes} onChange={e => setTaskForm({...taskForm, notes: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all font-medium" placeholder="Nhập ghi chú hoặc yêu cầu chi tiết..."></textarea></div>
                                        </>
                                    )}
                                    {activeTab === 'Meetings' && (
                                        <>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Thời gian</label><input type="datetime-local" required value={meetingForm.time} onChange={e => setMeetingForm({...meetingForm, time: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all" /></div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Nội dung họp</label><textarea required rows="2" value={meetingForm.content} onChange={e => setMeetingForm({...meetingForm, content: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all" placeholder="Vd: Duyệt danh sách diễn giả..."></textarea></div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Thành phần</label><input type="text" required value={meetingForm.attendees} onChange={e => setMeetingForm({...meetingForm, attendees: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all" /></div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Link tài liệu (Nếu có)</label><input type="url" value={meetingForm.docLink} onChange={e => setMeetingForm({...meetingForm, docLink: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all" /></div>
                                        </>
                                    )}
                                    {activeTab === 'Documents' && (
                                        <>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Tên tài liệu</label><input type="text" required value={docForm.name} onChange={e => setDocForm({...docForm, name: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all" /></div>
                                            <div><label className="block text-xs font-bold text-gray-500 uppercase mb-1">Đường dẫn liên kết</label><input type="url" required value={docForm.link} onChange={e => setDocForm({...docForm, link: e.target.value})} className="w-full border-2 border-gray-100 bg-gray-50 rounded-xl px-4 py-2.5 focus:border-blue-500 outline-none transition-all" placeholder="https://..." /></div>
                                        </>
                                    )}
                                    <div className="flex justify-end gap-3 pt-4">
                                        <button type="button" onClick={closeModal} className="px-6 py-3 text-gray-500 hover:text-gray-700 font-bold text-sm uppercase">Hủy bỏ</button>
                                        <button type="submit" className="px-8 py-3 text-white bg-blue-600 hover:bg-blue-700 rounded-xl font-bold text-sm shadow-lg uppercase transition-all">Lưu dữ liệu</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
